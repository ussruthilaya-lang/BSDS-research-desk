<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="452" fill="white"/>
<rect x="20" y="40" width="180" height="72" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="110.0" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Replay harness</text>
<text x="110.0" y="80" text-anchor="middle" font-size="11.5" fill="#333">scripted users (Mode A)</text>
<text x="110.0" y="98" text-anchor="middle" font-size="11.5" fill="#333">every measured result</text>
<rect x="20" y="165" width="180" height="68" rx="7" fill="#fff3e0" stroke="#c77700" stroke-width="1.6"/>
<text x="110.0" y="187" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Claude Desktop / Code</text>
<text x="110.0" y="205" text-anchor="middle" font-size="11.5" fill="#333">real agents (Mode B)</text>
<text x="110.0" y="223" text-anchor="middle" font-size="11.5" fill="#333">demo only</text>
<rect x="20" y="262" width="180" height="68" rx="7" fill="#fff3e0" stroke="#c77700" stroke-width="1.6"/>
<text x="110.0" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">MCP server</text>
<text x="110.0" y="302" text-anchor="middle" font-size="11.5" fill="#333">thin wrapper, public</text>
<text x="110.0" y="320" text-anchor="middle" font-size="11.5" fill="#333">through a tunnel</text>
<rect x="250" y="125" width="170" height="72" rx="7" fill="#eef3fa" stroke="#3b5470" stroke-width="1.6"/>
<text x="335.0" y="147" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Job API</text>
<text x="335.0" y="165" text-anchor="middle" font-size="11.5" fill="#333">POST /jobs</text>
<text x="335.0" y="183" text-anchor="middle" font-size="11.5" fill="#333">POST /search</text>
<rect x="250" y="245" width="170" height="72" rx="7" fill="#eef3fa" stroke="#3b5470" stroke-width="1.6"/>
<text x="335.0" y="267" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Lead</text>
<text x="335.0" y="285" text-anchor="middle" font-size="11.5" fill="#333">admit, plan,</text>
<text x="335.0" y="303" text-anchor="middle" font-size="11.5" fill="#333">gather by the deadline</text>
<rect x="480" y="40" width="170" height="56" rx="7" fill="#eef3fa" stroke="#3b5470" stroke-width="1.6"/>
<text x="565.0" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Task stream</text>
<text x="565.0" y="80" text-anchor="middle" font-size="11.5" fill="#333">one task per subagent (Redis)</text>
<rect x="480" y="130" width="170" height="84" rx="7" fill="#eef3fa" stroke="#3b5470" stroke-width="1.6"/>
<text x="565.0" y="152" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Workers 1 to W</text>
<text x="565.0" y="170" text-anchor="middle" font-size="11.5" fill="#333">run subagent tasks,</text>
<text x="565.0" y="188" text-anchor="middle" font-size="11.5" fill="#333">heartbeat for the lease</text>
<rect x="710" y="40" width="170" height="84" rx="7" fill="#eef3fa" stroke="#3b5470" stroke-width="1.6"/>
<text x="795.0" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Redis shared state</text>
<text x="795.0" y="80" text-anchor="middle" font-size="11.5" fill="#333">cache, in-flight table,</text>
<text x="795.0" y="98" text-anchor="middle" font-size="11.5" fill="#333">leases, checkpoints</text>
<rect x="710" y="165" width="170" height="88" rx="7" fill="#eef3fa" stroke="#3b5470" stroke-width="1.6"/>
<text x="795.0" y="187" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Gateway</text>
<text x="795.0" y="205" text-anchor="middle" font-size="11.5" fill="#333">bounded queue, 3 s pacer,</text>
<text x="795.0" y="223" text-anchor="middle" font-size="11.5" fill="#333">deadline check, user quotas</text>
<rect x="710" y="290" width="170" height="78" rx="7" fill="#eef3fa" stroke="#3b5470" stroke-width="1.6"/>
<text x="795.0" y="312" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Provider simulator</text>
<text x="795.0" y="330" text-anchor="middle" font-size="11.5" fill="#333">one call at a time;</text>
<text x="795.0" y="348" text-anchor="middle" font-size="11.5" fill="#333">counts violations (must be 0)</text>
<rect x="20" y="388" width="860" height="52" rx="7" fill="#f3f0fa" stroke="#5b4a8a" stroke-width="1.6"/>
<text x="450.0" y="410" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Every service writes events and metrics</text>
<text x="450.0" y="428" text-anchor="middle" font-size="11.5" fill="#333">Grafana dashboard for numbers over time; live control room for what is happening now</text>
<polyline points="200,76 225,76 225,150 250,150" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="110,233 110,262" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="200,296 225,296 225,178 250,178" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="335,197 335,245" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="420,281 450,281 450,68 480,68" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="444" y="120" font-size="10.5" fill="#444" text-anchor="end" font-style="italic">N tasks</text>
<polyline points="565,96 565,130" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="650,150 680,150 680,82 710,82" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="700" y="140" font-size="10.5" fill="#444" text-anchor="middle" font-style="italic">lookup, claim</text>
<polyline points="650,195 710,205" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="678" y="226" font-size="10.5" fill="#444" text-anchor="middle" font-style="italic">cache miss</text>
<polyline points="795,253 795,290" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="530,214 530,305 420,305" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a)"/>
<text x="535" y="324" font-size="10.5" fill="#444" text-anchor="start" font-style="italic">results flow back through Redis</text>
</svg>
